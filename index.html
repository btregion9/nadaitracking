<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BTr 9 NADAI Tracking</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/btregion9/assets/79103198eaf9ed8feb8979dc4c7ab03d3f77acfd/BTr-Original-Logo-1.png">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f8fafc;
        }
        iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>
    <!-- The iframe src is intentionally left blank here so JavaScript can build it -->
    <iframe id="nadaiIframe"></iframe>

    <script>
        // 1. Grab the email saved by your BTr IX Login portal on this domain
        const activeUser = localStorage.getItem('loggedUserEmail') || "";
        
        // 2. Your base Google Apps Script deployment link
        const baseUrl = "https://script.google.com/macros/s/AKfycby9HjzSsemcE7rEkxw-6efj4LMC1Yxa0TDJGCNx2s7BxWsXnJqzOR1XcMVwE8MQRi9u/exec";
        
        // 3. Attach the email to the URL and load the iframe
        document.getElementById("nadaiIframe").src = baseUrl + "?user=" + encodeURIComponent(activeUser);
    </script>
</body>
</html>
